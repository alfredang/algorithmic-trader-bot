[project]
name = "algorithmic-trader-bot"
version = "2.0.0"
description = "Quant / algorithmic trading simulator (paper trading only) - companion software for the IBF course 'Machine Learning 101 for Financial Trading' (Tertiary Infotech Academy)."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Dr. Alfred Ang", email = "angch@tertiaryinfotech.com" }]
requires-python = ">=3.11"
keywords = ["algorithmic-trading", "backtesting", "quant", "paper-trading", "alpaca", "tradingview", "machine-learning"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Framework :: FastAPI",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "apscheduler>=3.10,<4",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "pandas>=2.2",
    "numpy>=1.26",
    "scipy>=1.12",
    "scikit-learn>=1.4",
    "xgboost>=2.0",
    "matplotlib>=3.8",
    "alpaca-py>=0.33",
    "yfinance>=0.2.40",
    "vaderSentiment>=3.3.2",
    "psycopg[binary]>=3.1",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Optional LLM providers for the AI Agents desk. The app works fully without them
# (deterministic rule-based agents).
ai = [
    "claude-agent-sdk>=0.1.0",
    "openai-agents>=0.2.0",
    "openai-codex>=0.160.0",
]

[project.scripts]
trader = "trader.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trader"]

[tool.ruff]
line-length = 165
target-version = "py311"
extend-exclude = ["legacy"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E741", "B008", "SIM108", "SIM105", "SIM401"]

[tool.ruff.lint.isort]
known-third-party = ["alembic"]
known-first-party = ["trader"]

[tool.ruff.lint.per-file-ignores]
"src/trader/content/*.py" = ["E501"]
"alembic/versions/*.py" = ["E501"]
"src/trader/strategies/sandbox_worker.py" = ["E501"]
"src/trader/strategies/pine.py" = ["E501"]
"src/trader/strategies/registry.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning", "ignore::UserWarning", "ignore::FutureWarning"]
