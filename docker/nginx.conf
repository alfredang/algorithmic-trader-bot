server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    location = /healthz { return 200 "ok\n"; add_header Content-Type text/plain; }
    location = / { try_files /index.html =404; add_header Cache-Control "no-cache"; }
    location /static/ { add_header Cache-Control "no-cache"; try_files $uri =404; }
    location /screenshots/ { try_files $uri =404; }

    # Server-Sent Events: no buffering, long-lived
    location /api/events/stream {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }
    location ~ ^/(api|docs|redoc|guide\.md) {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;                    # long backtests / agent runs
        client_max_body_size 2m;
    }
}
