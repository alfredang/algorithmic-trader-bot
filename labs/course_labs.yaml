  - id: 16
    topic: 4
    title: "Forward test: a scheduled paper-trading bot with a kill switch"
    objective: "Create a bot, run it on a schedule, watch orders, positions and P&L live, and halt it with the kill switch."
    expected: "A bot equity curve, a blotter of its orders, a backtest-vs-forward comparison and a tested kill switch."
    course_link: "Topic 4.3; Lab 16"
    steps:
      - title: "Create the bot"
        instruction: "Paper Trading > + New bot: EMA crossover 10/30 on SPY, schedule 'every 10s', simulator broker, replay from 2025-01-02."
        app_route: "trading?new=1&strategy=ema_cross"
        preset: "Paper Trading > New bot (EMA cross)"
        check: "The bot appears with status stopped."
      - title: "Start it and watch"
        instruction: "Press Start (the worker must run: `uv run trader worker` or `uv run trader serve --with-worker`). Every cycle replays one trading day: it sees bars to yesterday's close and its orders fill at today's open. Or press 'Run one cycle now' repeatedly."
        app_route: "trading"
        check: "Equity curve grows cycle by cycle; the Pipeline Map path lights up during each cycle."
      - title: "Kill switch"
        instruction: "Press the bot's Kill switch, then try 'Run one cycle now'. Release it. Try the global kill switch in the top bar too."
        app_route: "trading"
        check: "Cycles report 'kill switch ON - no orders sent'; the Risk stage turns red on the Pipeline Map."
      - title: "Backtest vs forward"
        instruction: "Press Compare in 'Backtest vs forward test'."
        app_route: "trading"
        check: "The curves track closely; you can explain the remaining gap (whole shares, fills, timing)."

  - id: 17
    topic: 4
    title: "TradingView webhook alerts to the bot"
    objective: "Send TradingView alerts to the app's webhook and see them pass validation, signal confirmation and risk into paper orders."
    expected: "7 simulated alerts handled as expected and the audit log."
    course_link: "Topic 4.1; Lab 17"
