      - title: "Real alerts (paid TradingView plan)"
        instruction: "Expose the app with `ngrok http 8000`, create an alert on the exported Pine strategy with the webhook URL https://<tunnel>/api/webhooks/tradingview and the message. Optionally tick 'Reject alerts that disagree with the app's own signal'."
        app_route: "integrations"
        check: "The alert appears in the audit log and its order in Paper Trading > Orders (source webhook)."

  - id: 18
    topic: 4
    title: "Diagnose bias: look-ahead, cost drag, overfitting, survivorship"
